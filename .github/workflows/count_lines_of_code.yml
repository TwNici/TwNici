name: Count Lines of Code and Update README

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  count_lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.GH_TOKEN }}   # Verwendet das Secret direkt beim Checkout

      - name: Install cloc
        run: sudo apt-get install cloc

      - name: Count Lines of Code
        run: cloc . --by-file --exclude-dir=.git,node_modules --out=cloc_result.txt

      - name: Get total lines from cloc result
        id: get_lines
        run: |
          TOTAL_LINES=$(awk '/^SUM/{print $5}' cloc_result.txt)
          echo "TOTAL_LINES=$TOTAL_LINES" >> $GITHUB_ENV

      - name: Update README.md with total lines of code
        run: |
          sed -i "s/\[TOTAL_LINES\]/$TOTAL_LINES/g" README.md

      - name: Commit and push changes to README.md
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README with total lines of code"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
