name: Count Lines of Code and Update README

on:
  push:
    branches:
      - main
  workflow_dispatch:

# <-- this is important, otherwise the default is read-only
permissions:
  contents: write

jobs:
  count_lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count lines of code
        run: |
          TOTAL_LINES=$(git ls-files | xargs wc -l | tail -n1 | awk '{print $1}')
          echo "TOTAL_LINES=$TOTAL_LINES" >> $GITHUB_ENV
          echo "Total lines: $TOTAL_LINES"

      - name: Update README
        run: |
          # Badge: replace [TOTAL_LINES] inside the badge URL
          sed -i "s/\[TOTAL_LINES\]/$TOTAL_LINES/g" README.md
          # Text line: replace [TOTAL_LINES] in the description
          sed -i "s/\[TOTAL_LINES\]/$TOTAL_LINES/g" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update README with total lines of code" || exit 0

          # VERY IMPORTANT: push to 'origin', so it uses the token set by actions/checkout
          git push origin HEAD:main
